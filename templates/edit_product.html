{% extends "base.html" %}
{% block title %}Edit Product - ShopEase{% endblock %}
{% block content %}
<h1>✏️ Edit Product</h1>
<form class="form" method="POST">
<label>Product Name</label><input name="name" value="{{ product.name }}" required>
<label>Price</label><input type="number" step="0.01" name="price" value="{{ product.price }}" required>
<label>Category</label>
<select name="category" required>
{% for c in ["Fashion","Electronics","Accessories","Home","Books"] %}
<option value="{{ c }}" {% if product.category==c %}selected{% endif %}>{{ c }}</option>
{% endfor %}
</select>
<label>Description</label><textarea name="description" rows="4" required>{{ product.description }}</textarea>
<button class="btn primary" type="submit">Update Product</button>
</form>
{% endblock %}
