{% extends "base.html" %}
{% block title %}Add Product - ShopEase{% endblock %}
{% block content %}
<h1>➕ Add Product</h1>
<form class="form" method="POST">
<label>Product Name</label><input name="name" required>
<label>Price</label><input type="number" step="0.01" name="price" required>
<label>Category</label>
<select name="category" required>
<option value="">Select</option><option>Fashion</option><option>Electronics</option><option>Accessories</option><option>Home</option><option>Books</option>
</select>
<label>Description</label><textarea name="description" rows="4" required></textarea>
<button class="btn success" type="submit">Add Product</button>
</form>
{% endblock %}
